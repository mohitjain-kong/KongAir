name: CI — Build, Validate and Stage Kong for PRD

on:
  push:
    branches:
      - workflow/**
  workflow_dispatch:

jobs:

  has-changes:
    name: Check for relevant changes
    runs-on: ubuntu-latest
    outputs:
      are-changes: ${{ steps.changed-files.outputs.files }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: changed-files
        with:
          filters: |
            files:
              - '.github/workflows/ci-kong.yaml'
              - 'flight-data/flights/openapi.yaml'
              - 'flight-data/flights/kong/**'
              - 'flight-data/routes/openapi.yaml'
              - 'flight-data/routes/kong/**'
              - 'sales/bookings/openapi.yaml'
              - 'sales/bookings/kong/**'
              - 'sales/customer/openapi.yaml'
              - 'sales/customer/kong/**'
              - 'experience/kong/**'
              - 'platform/kong/**'

  oas-break:
    name: Check for breaking OAS changes
    needs: has-changes
    if: ${{ needs.has-changes.outputs.are-changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - dir: flight-data
            name: flights
          - dir: flight-data
            name: routes
          - dir: sales
            name: bookings
          - dir: sales
            name: customer
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2
      - name: Base OAS
        run: |
          git show HEAD~1:${{ matrix.app.dir }}/${{ matrix.app.name }}/openapi.yaml > base.yaml \
            || cp ${{ matrix.app.dir }}/${{ matrix.app.name }}/openapi.yaml base.yaml
      - name: Check breaking changes
        uses: oasdiff/oasdiff-action/breaking@main
        id: oasdiff
        with:
          base: base.yaml
          revision: ${{ matrix.app.dir }}/${{ matrix.app.name }}/openapi.yaml
      - name: Create Issue on breaking change
        if: steps.oasdiff.outputs.breaking != 'No breaking changes'
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_NAME: ${{ matrix.app.name }}
          BREAKING_CHANGES: ${{ steps.oasdiff.outputs.breaking }}
        with:
          filename: .github/ISSUE_TEMPLATE/breaking-change.md

  build-validate-stage:
    name: Build → Validate → Diff → Open PRD PR
    needs: [has-changes, oas-break]
    if: ${{ needs.has-changes.outputs.are-changes == 'true' }}
    runs-on: ubuntu-latest
    environment: prd

    steps:
      - uses: actions/checkout@v3

      - uses: kong/setup-deck@v1
        with:
          deck-version: '1.58.0'
          wrapper: false

      - name: Convert Flights API to Kong
        run: |
          deck file openapi2kong -s flight-data/flights/openapi.yaml | \
            deck file patch flight-data/flights/kong/patches.yaml | \
            deck file add-tags -o .github/artifacts/kong/flight-data-flights-kong.yaml \
              --selector "$.services[*]" --selector "$.services[*].routes[*]" flight-data1

      - name: Convert Routes API to Kong
        run: |
          deck file openapi2kong -s flight-data/routes/openapi.yaml | \
            deck file patch flight-data/routes/kong/patches.yaml | \
            deck file add-tags -o .github/artifacts/kong/flight-data-routes-kong.yaml \
              --selector "$.services[*]" --selector "$.services[*].routes[*]" route-data

      - name: Convert Bookings API to Kong
        run: |
          deck file openapi2kong -s sales/bookings/openapi.yaml | \
            deck file patch sales/bookings/kong/patches.yaml | \
            deck file add-tags -o .github/artifacts/kong/sales-bookings-kong.yaml \
              --selector "$.services[*]" --selector "$.services[*].routes[*]" sales

      - name: Convert Customer API to Kong
        run: |
          deck file openapi2kong -s sales/customer/openapi.yaml | \
            deck file patch sales/customer/kong/patches.yaml | \
            deck file add-tags -o .github/artifacts/kong/sales-customer-kong.yaml \
              --selector "$.services[*]" --selector "$.services[*].routes[*]" sales

      - name: Merge all Kong configurations
        run: |
          deck file merge \
            .github/artifacts/kong/*-kong.yaml \
            -o .github/artifacts/kong/kong-combined.yaml

      - name: Merge Experience layer
        run: |
          deck file merge \
            .github/artifacts/kong/kong-combined.yaml \
            experience/kong/experience-service.yaml \
            -o .github/artifacts/kong/kong-combined.yaml

      - name: Platform additions, patches and tag
        run: |
          deck file merge \
            .github/artifacts/kong/kong-combined.yaml \
            platform/kong/platform-kong-base.yaml \
            platform/kong/consumers/* \
            platform/kong/plugins/* \
            platform/kong/vaults/* | \
          deck file patch platform/kong/patches.yaml | \
          deck file add-tags \
            -o PRD/kong/kong.yaml \
            "platform-repo-managed"

      - name: Lint
        run: deck file lint -s PRD/kong/kong.yaml platform/kong/lint-rulesets.yaml

      - name: Validate against Konnect
        run: |
          deck gateway validate \
            --konnect-control-plane-name "${{ vars.KONNECT_CP_NAME }}" \
            --konnect-token ${{ secrets.KONNECT_PAT }} \
            --konnect-addr "${{ vars.KONNECT_ADDR }}" \
            PRD/kong/kong.yaml

      - name: Diff against Konnect
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "DIFF<<$EOF" >> $GITHUB_ENV
          deck gateway diff --select-tag platform-repo-managed \
            --konnect-control-plane-name "${{ vars.KONNECT_CP_NAME }}" \
            --konnect-token ${{ secrets.KONNECT_PAT }} \
            --konnect-addr "${{ vars.KONNECT_ADDR }}" \
            PRD/kong/kong.yaml >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kong-configurations
          path: .github/artifacts/kong/*.yaml

      - name: Commit PRD/kong/kong.yaml back to workflow branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PRD/kong/kong.yaml
          git diff --cached --quiet || git commit -m "chore: update PRD/kong/kong.yaml [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Open or update PR to main with diff
        run: |
          BRANCH="${{ github.ref_name }}"
          PR_NUMBER=$(gh pr list --head "$BRANCH" --base main --json number -q '.[0].number')
          BODY="$(printf 'Merging this PR will apply the following changes to the Kong Gateway in PRD and republish API specs to Dev Portal and Konnect Catalog.\n\n**Gateway diff:**\n```\n%s\n```' "$DIFF")"

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --title "❗PRD❗: Deploy Kong Gateway changes to production" \
              --base main \
              --head "$BRANCH" \
              --label "PRD,kong" \
              --body "$BODY"
          else
            gh pr edit "$PR_NUMBER" --body "$BODY"
            echo "Updated existing PR #$PR_NUMBER"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIFF: ${{ env.DIFF }}
