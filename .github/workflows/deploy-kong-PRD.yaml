name: Deploy Kong changes to PRD

on:
  push:
    branches:
      - main
    paths:
      - PRD/kong/kong.yaml
      - flight-data/flights/openapi.yaml
      - flight-data/routes/openapi.yaml
      - sales/bookings/openapi.yaml
      - sales/customer/openapi.yaml
  workflow_dispatch:

jobs:

  deploy-kong:
    name: Deploy Kong to PRD
    runs-on: ubuntu-latest
    environment: prd

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup deck
        uses: kong/setup-deck@v1
        with:
          deck-version: '1.58.0'
          wrapper: false

      - name: deck sync konnect
        run: |
          deck gateway sync --select-tag platform-repo-managed \
            --konnect-control-plane-name "${{ vars.KONNECT_CP_NAME }}" \
            --konnect-token ${{ secrets.KONNECT_PAT }} \
            --konnect-addr "${{ vars.KONNECT_ADDR }}" \
            PRD/kong/kong.yaml

      - name: Publish API specs to Konnect Dev Portal
        run: |
          for app in \
            "KongAir Flights:flight-data/flights/openapi.yaml" \
            "KongAir Routes:flight-data/routes/openapi.yaml" \
            "KongAir Bookings:sales/bookings/openapi.yaml" \
            "KongAir Customer:sales/customer/openapi.yaml"; do

            PRODUCT_NAME="${app%%:*}"
            SPEC_FILE="${app##*:}"
            VERSION=$(yq '.info.version' "$SPEC_FILE")

            # Get or create API product
            PRODUCT_ID=$(curl -s "${{ vars.KONNECT_ADDR }}/v2/api-products" \
              -H "Authorization: Bearer ${{ secrets.KONNECT_PAT }}" | jq -r --arg name "$PRODUCT_NAME" '.data[] | select(.name == $name) | .id // empty' | head -1)

            if [ -z "$PRODUCT_ID" ]; then
              PRODUCT_ID=$(curl -s -X POST "${{ vars.KONNECT_ADDR }}/v2/api-products" \
                -H "Authorization: Bearer ${{ secrets.KONNECT_PAT }}" \
                -H "Content-Type: application/json" \
                -d "{\"name\": \"$PRODUCT_NAME\", \"description\": \"Managed by APIOps pipeline\", \"portal_ids\": [\"${{ vars.KONNECT_PORTAL_ID }}\"]}" \
                | jq -r '.id')
              echo "Created API product: $PRODUCT_NAME ($PRODUCT_ID)"
            else
              curl -s -X PATCH "${{ vars.KONNECT_ADDR }}/v2/api-products/$PRODUCT_ID" \
                -H "Authorization: Bearer ${{ secrets.KONNECT_PAT }}" \
                -H "Content-Type: application/json" \
                -d "{\"portal_ids\": [\"${{ vars.KONNECT_PORTAL_ID }}\"]}" > /dev/null
              echo "Found existing API product: $PRODUCT_NAME ($PRODUCT_ID)"
            fi

            # Get or create product version
            VERSION_ID=$(curl -s "${{ vars.KONNECT_ADDR }}/v2/api-products/$PRODUCT_ID/product-versions?filter[name]=$VERSION" \
              -H "Authorization: Bearer ${{ secrets.KONNECT_PAT }}" | jq -r '.data[0].id // empty')

            if [ -z "$VERSION_ID" ]; then
              VERSION_ID=$(curl -s -X POST "${{ vars.KONNECT_ADDR }}/v2/api-products/$PRODUCT_ID/product-versions" \
                -H "Authorization: Bearer ${{ secrets.KONNECT_PAT }}" \
                -H "Content-Type: application/json" \
                -d "{\"name\": \"$VERSION\", \"publish_status\": \"published\"}" \
                | jq -r '.id')
              echo "Created version $VERSION for $PRODUCT_NAME ($VERSION_ID)"
            else
              echo "Found existing version $VERSION for $PRODUCT_NAME ($VERSION_ID)"
            fi

            # Upload or update spec
            SPEC_CONTENT=$(base64 -w 0 "$SPEC_FILE")
            SPEC_ID=$(curl -s "${{ vars.KONNECT_ADDR }}/v2/api-products/$PRODUCT_ID/product-versions/$VERSION_ID/specifications" \
              -H "Authorization: Bearer ${{ secrets.KONNECT_PAT }}" | jq -r '.data[0].id // empty')

            if [ -z "$SPEC_ID" ]; then
              curl -s -X POST "${{ vars.KONNECT_ADDR }}/v2/api-products/$PRODUCT_ID/product-versions/$VERSION_ID/specifications" \
                -H "Authorization: Bearer ${{ secrets.KONNECT_PAT }}" \
                -H "Content-Type: application/json" \
                -d "{\"name\": \"oas.yaml\", \"content\": \"$SPEC_CONTENT\"}" > /dev/null
            else
              curl -s -X PATCH "${{ vars.KONNECT_ADDR }}/v2/api-products/$PRODUCT_ID/product-versions/$VERSION_ID/specifications/$SPEC_ID" \
                -H "Authorization: Bearer ${{ secrets.KONNECT_PAT }}" \
                -H "Content-Type: application/json" \
                -d "{\"name\": \"oas.yaml\", \"content\": \"$SPEC_CONTENT\"}" > /dev/null
            fi
            echo "Published spec for $PRODUCT_NAME v$VERSION to Dev Portal"
          done

      - name: Publish APIs to Konnect Catalog
        run: |
          for app in \
            "KongAir Flights:flight-data/flights/openapi.yaml" \
            "KongAir Routes:flight-data/routes/openapi.yaml" \
            "KongAir Bookings:sales/bookings/openapi.yaml" \
            "KongAir Customer:sales/customer/openapi.yaml"; do

            API_NAME="${app%%:*}"
            SPEC_FILE="${app##*:}"
            VERSION=$(yq '.info.version' "$SPEC_FILE")
            SPEC_CONTENT=$(cat "$SPEC_FILE" | jq -Rs '.')

            # Get or create catalog API
            API_ID=$(curl -s "${{ vars.KONNECT_ADDR }}/v3/apis" \
              -H "Authorization: Bearer ${{ secrets.KONNECT_PAT }}" | jq -r --arg name "$API_NAME" '.data[] | select(.name == $name) | .id // empty' | head -1)

            if [ -z "$API_ID" ]; then
              API_ID=$(curl -s -X POST "${{ vars.KONNECT_ADDR }}/v3/apis" \
                -H "Authorization: Bearer ${{ secrets.KONNECT_PAT }}" \
                -H "Content-Type: application/json" \
                -d "{\"name\": \"$API_NAME\", \"version\": \"$VERSION\", \"description\": \"Managed by APIOps pipeline\"}" \
                | jq -r '.id')
              echo "Created catalog API: $API_NAME ($API_ID)"
            else
              echo "Found existing catalog API: $API_NAME ($API_ID)"
            fi

            # Find existing version or create new (upsert)
            EXISTING_VERSIONS=$(curl -s "${{ vars.KONNECT_ADDR }}/v3/apis/$API_ID/versions" \
              -H "Authorization: Bearer ${{ secrets.KONNECT_PAT }}")
            VERSION_ID=$(echo "$EXISTING_VERSIONS" | jq -r --arg v "$VERSION" '.data[] | select(.version == $v) | .id // empty' | head -1)

            if [ -z "$VERSION_ID" ]; then
              UPLOAD_RESULT=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ vars.KONNECT_ADDR }}/v3/apis/$API_ID/versions" \
                -H "Authorization: Bearer ${{ secrets.KONNECT_PAT }}" \
                -H "Content-Type: application/json" \
                -d "{\"spec\": {\"content\": $SPEC_CONTENT}}")
              echo "Spec created for $API_NAME: $(echo "$UPLOAD_RESULT" | tail -1)"
            else
              UPLOAD_RESULT=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PATCH "${{ vars.KONNECT_ADDR }}/v3/apis/$API_ID/versions/$VERSION_ID" \
                -H "Authorization: Bearer ${{ secrets.KONNECT_PAT }}" \
                -H "Content-Type: application/json" \
                -d "{\"spec\": {\"content\": $SPEC_CONTENT}}")
              echo "Spec updated for $API_NAME ($VERSION_ID): $(echo "$UPLOAD_RESULT" | tail -1)"
            fi

            # Publish to v3 portal
            PUBLISH_RESULT=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PUT "${{ vars.KONNECT_ADDR }}/v3/apis/$API_ID/publications/${{ vars.KONNECT_PORTAL_ID_V3 }}" \
              -H "Authorization: Bearer ${{ secrets.KONNECT_PAT }}" \
              -H "Content-Type: application/json" \
              -d '{"visibility": "public"}')
            echo "Publish for $API_NAME: $(echo "$PUBLISH_RESULT" | tail -1)"

            echo "Published $API_NAME v$VERSION to Konnect Catalog and finastra Demo portal"
          done
